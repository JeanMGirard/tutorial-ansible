---
- name: Modules | ensure demo directory exists
  ansible.builtin.file:
    path: /tmp/intermediate-example
    state: directory
    mode: "0755"
  tags:
    - modules

- name: Modules | copy a template-like config snippet
  ansible.builtin.copy:
    dest: /tmp/intermediate-example/config.ini
    mode: "0644"
    content: |
      [intermediate]
      enabled=true
      generated_by=ansible
  notify: restart demo service
  tags:
    - modules

- name: Modules | gather package facts
  ansible.builtin.package_facts:
    manager: auto
  tags:
    - modules

- name: Modules | show whether curl is installed
  ansible.builtin.debug:
    msg: "curl installed={{ 'curl' in ansible_facts.packages }}"
  tags:
    - modules
